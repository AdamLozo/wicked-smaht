<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a2744"/>

  <!-- Decorative border -->
  <rect x="20" y="20" width="1160" height="590" rx="20"
        fill="none" stroke="#c9a227" stroke-width="3" opacity="0.3"/>

  <!-- Key symbol (centered, larger) -->
  <g transform="translate(600, 250)">
    <!-- Key head circle -->
    <circle cx="-80" cy="0" r="90" fill="none" stroke="#c9a227" stroke-width="20"/>
    <circle cx="-80" cy="0" r="35" fill="#1a2744"/>

    <!-- Key shaft -->
    <rect x="0" y="-15" width="200" height="30" rx="15" fill="#c9a227"/>

    <!-- Key teeth -->
    <rect x="120" y="15" width="20" height="50" rx="5" fill="#c9a227"/>
    <rect x="150" y="15" width="20" height="65" rx="5" fill="#c9a227"/>
    <rect x="180" y="15" width="20" height="40" rx="5" fill="#c9a227"/>
  </g>

  <!-- Title -->
  <text x="600" y="450"
        font-family="Georgia, serif"
        font-size="80"
        font-weight="bold"
        fill="#c9a227"
        text-anchor="middle">Wicked Smaht</text>

  <!-- Subtitle -->
  <text x="600" y="520"
        font-family="Georgia, serif"
        font-size="36"
        fill="#f5f0e1"
        text-anchor="middle">A Boston Trivia Adventure</text>

  <!-- Tagline -->
  <text x="600" y="580"
        font-family="Arial, sans-serif"
        font-size="24"
        fill="#f5f0e1"
        opacity="0.7"
        text-anchor="middle">Test your Boston knowledge and collect all the keys!</text>
</svg>
